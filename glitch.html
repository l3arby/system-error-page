<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Failure</title>
    <style>
        body {
            background: black;
            color: red;
            font-family: "Courier New", monospace;
            text-align: center;
            padding-top: 20vh;
            font-size: 22px;
            overflow: hidden;
            margin: 0;
        }
        .glitch {
            position: relative;
            animation: glitch 0.5s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -3px); }
            60% { transform: translate(-3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: red;
            overflow: hidden;
        }
        .glitch::before {
            left: 3px;
            text-shadow: -3px 0 cyan;
            animation: glitch-before 0.5s infinite;
        }
        .glitch::after {
            left: -3px;
            text-shadow: 3px 0 magenta;
            animation: glitch-after 0.5s infinite;
        }
        @keyframes glitch-before {
            0% { clip: rect(24px, 550px, 90px, 0); }
            20% { clip: rect(32px, 550px, 90px, 0); }
            40% { clip: rect(48px, 550px, 90px, 0); }
            60% { clip: rect(12px, 550px, 90px, 0); }
            80% { clip: rect(60px, 550px, 90px, 0); }
            100% { clip: rect(24px, 550px, 90px, 0); }
        }
        @keyframes glitch-after {
            0% { clip: rect(24px, 550px, 90px, 0); }
            20% { clip: rect(32px, 550px, 90px, 0); }
            40% { clip: rect(48px, 550px, 90px, 0); }
            60% { clip: rect(12px, 550px, 90px, 0); }
            80% { clip: rect(60px, 550px, 90px, 0); }
            100% { clip: rect(24px, 550px, 90px, 0); }
        }
        .hidden {
            display: none;
        }
        .flicker {
            animation: flicker 0.1s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        .loading-bar {
            width: 50%;
            margin: 20px auto;
            height: 10px;
            background: #222;
            position: relative;
            overflow: hidden;
            border: 2px solid red;
        }
        .loading-bar::after {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            background: red;
            position: absolute;
            left: -100%;
            animation: loading 4s linear forwards;
        }
        @keyframes loading {
            from { left: -100%; }
            to { left: 0%; }
        }
        .terminal {
            color: lime;
            font-size: 26px;
            text-shadow: 0 0 5px lime;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid lime;
            animation: blink-caret 0.75s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: lime; }
        }
        .distort {
            animation: distort 1s infinite;
        }
        @keyframes distort {
            0% { transform: skew(0deg); }
            20% { transform: skew(10deg); }
            40% { transform: skew(-10deg); }
            60% { transform: skew(5deg); }
            80% { transform: skew(-5deg); }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
<body>
    <div id="errorText" class="glitch" data-text="⚠ SYSTEM FAILURE: CRITICAL FILES CORRUPTED...">⚠ SYSTEM FAILURE: CRITICAL FILES CORRUPTED...</div>
    <div id="loadingSection" class="hidden">
        <div class="flicker">ATTEMPTING DATA RECOVERY...</div>
        <div class="loading-bar"></div>
    </div>
    <div id="finalMessage" class="hidden terminal"></div>

    <script>
        setTimeout(() => {
            document.getElementById('errorText').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');
        }, 3000); // After 3 sec, show "Attempting recovery"

        setTimeout(() => {
            document.getElementById('loadingSection').classList.add('hidden');
            const finalMessage = document.getElementById('finalMessage');
            finalMessage.classList.remove('hidden');
            const message = "You've been hacked... by love heh. Happy Birthday Negrooo!";
            let i = 0;
            const typingEffect = setInterval(() => {
                if (i < message.length) {
                    finalMessage.textContent += message.charAt(i);
                    i++;
                } else {
                    clearInterval(typingEffect);
                }
            }, 100); // Typing speed
        }, 7000); // After 7 sec, show birthday message
    </script>
</body>
</html>
